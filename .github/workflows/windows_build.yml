name: Windows Release Forge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to trigger it manually from the website

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Vault Source Code
      uses: actions/checkout@v4

    - name: Set up Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Fetch Dependencies
      run: flutter pub get

    - name: Forge Windows Executable
      run: flutter build windows --release

    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Progresso-HQ-Windows-v1.1.0
        path: build\windows\x64\runner\Release\
